<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daisy的遊戲室</title>
<meta name="description" content="貓咪頻道做的紓壓小遊戲，點了就能玩，不用登入。">
<meta property="og:title" content="Daisy的遊戲室">
<meta property="og:description" content="貓咪頻道做的紓壓小遊戲，點了就能玩，不用登入。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://daisy-play.github.io/">
<meta property="og:image" content="https://daisy-play.github.io/images/litter.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root {
  --paper: #e6d7bc;
  --ink: #4f3a2d;
  --soft: #66503f;
  --card: #fffaf0;
  --line: #b99d74;
  --red: #c9404a;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  line-height: 1.6;
}
main {
  max-width: 880px;
  margin: 0 auto;
  padding: 48px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px));
}
header { text-align: center; margin-bottom: 36px; }
h1 {
  margin: 0;
  font-size: clamp(38px, 9vw, 60px);
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1.2;
  color: var(--ink);
}
header p { margin: 10px 0 0; font-size: 18px; color: var(--soft); }
.games { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.game {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  transition: transform .18s ease, border-color .18s ease;
}
.game:hover { transform: translateY(-4px) rotate(-.4deg); border-color: var(--red); }
.game:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
.game img { display: block; width: 100%; height: auto; aspect-ratio: 720 / 597; }
.info { display: flex; flex-direction: column; gap: 6px; flex: 1; padding: 18px 20px 20px; }
.by { font-size: 14px; color: var(--soft); }
h2 { margin: 0; font-size: 28px; font-weight: 400; line-height: 1.3; }
.info p { margin: 0 0 12px; font-size: 16px; }
.play {
  margin-top: auto;
  align-self: flex-start;
  padding: 8px 24px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: 18px;
}
footer { margin-top: 36px; text-align: center; font-size: 14px; color: var(--soft); }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } .game:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Daisy的遊戲室</h1>
    <p>點了就能玩，不用登入。</p>
  </header>

  <div class="games">
    <a class="game" href="litter/">
      <img src="images/litter.jpg" width="720" height="597" alt="羊毛氈手作貓和裝滿團子的貓砂鏟">
      <div class="info">
        <span class="by">手作貓</span>
        <h2>幫貓鏟屎</h2>
        <p>60 秒內撈起砂裡的小團子，丟進垃圾桶，讓貓主子滿意。</p>
        <span class="play">開始玩</span>
      </div>
    </a>

    <a class="game" href="dinner/">
      <img src="images/dinner.jpg" width="720" height="597" alt="戴耳機和眼鏡的胖橘貓說 I'm full">
      <div class="info">
        <span class="by">英語貓</span>
        <h2>放飯時間！</h2>
        <p>幫大家倒飼料，還要防著胖橘搶飯。一關比一關忙，你能撐到第幾關？</p>
        <span class="play">開始玩</span>
      </div>
    </a>
  </div>

  <footer>© 手作貓 HandmadeCat・英語貓 EnglishCat</footer>
</main>
</body>
</html>
