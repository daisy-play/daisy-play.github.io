<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：過安檢";
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：過安檢" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });

  })(0);
}, true);

<title>過安檢！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：一張直式 9:16 的機場安檢站，等比縮放塞進螢幕；旅遊貓的線稿平塗風（不跟著深色模式變）。塞行李、拿行李的同一系列 */
:root {
  --paper: #fffaf0;
  --ink: #5b4a42;
  --red: #dd6a58;
  --blue: #4a7fa5;
  --gold: #e8b64c;
  --veil: rgba(221, 237, 246, .97);
  --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; box-sizing: border-box; overflow: hidden;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  background: #dfe7ec; color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; --u: 1px; touch-action: none; overflow: hidden; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.veil {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 20); background: var(--veil); text-align: center; padding: calc(var(--u) * 36);
  box-sizing: border-box;
}
.veil h1 { margin: 0; font-size: calc(var(--u) * 92); letter-spacing: .04em; color: var(--ink); font-weight: 400; line-height: 1.1; }
.tag {
  margin: 0; font-size: calc(var(--u) * 30); letter-spacing: .14em; color: var(--red);
  border: calc(var(--u) * 4) double var(--red); padding: calc(var(--u) * 6) calc(var(--u) * 22); transform: rotate(-2deg);
}
#startArt { height: calc(var(--u) * 340); max-width: 100%; object-fit: contain; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--u) * 10); font-size: calc(var(--u) * 30); line-height: 1.35; width: 100%; }
.how li { background: #fff; border: calc(var(--u) * 3) dashed #9db7c6; border-radius: calc(var(--u) * 18); padding: calc(var(--u) * 10) calc(var(--u) * 20); }
.btn {
  font-family: var(--font); font-size: calc(var(--u) * 44); color: #fffdf6; background: var(--red);
  border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 30); padding: calc(var(--u) * 12) calc(var(--u) * 64);
  box-shadow: 0 calc(var(--u) * 7) 0 var(--ink); cursor: pointer;
}
.btn:active { transform: translateY(calc(var(--u) * 5)); box-shadow: 0 calc(var(--u) * 2) 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn:focus-visible, #mute:focus-visible { outline: calc(var(--u) * 5) solid var(--gold); outline-offset: calc(var(--u) * 5); }
.best { margin: 0; font-size: calc(var(--u) * 28); min-height: 1.3em; }
.sign { margin: 0; font-size: calc(var(--u) * 22); color: #84705f; }
.card {
  background: #fff; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 26);
  padding: calc(var(--u) * 14) calc(var(--u) * 28); display: grid; gap: calc(var(--u) * 4); width: 100%; box-sizing: border-box; position: relative;
}
.card p { margin: 0; }
.rank { font-size: calc(var(--u) * 44); color: var(--red); line-height: 1.2; }
.score { font-size: calc(var(--u) * 92); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: calc(var(--u) * 36); }
.stats { font-size: calc(var(--u) * 25); opacity: .85; line-height: 1.4; white-space: pre-line; }
.newbest {
  position: absolute; top: calc(var(--u) * -22); right: calc(var(--u) * 10); font-size: calc(var(--u) * 26); color: var(--red); background: #fff;
  border: calc(var(--u) * 3) solid var(--red); border-radius: calc(var(--u) * 10); padding: 0 calc(var(--u) * 10); transform: rotate(8deg);
}
#endTray { width: calc(var(--u) * 620); max-width: 100%; height: auto; display: block; }
.fact { text-align: left; gap: calc(var(--u) * 2); }
.fact b { font-weight: 400; font-size: calc(var(--u) * 24); color: var(--blue); }
.fact .txt { font-size: calc(var(--u) * 27); line-height: 1.4; }
.fact .src { font-size: calc(var(--u) * 19); opacity: .6; }
.row { display: flex; gap: calc(var(--u) * 20); justify-content: center; }
.row .btn { padding: calc(var(--u) * 10) calc(var(--u) * 36); font-size: calc(var(--u) * 40); }
.btn.alt { background: var(--blue); }
#endScreen { gap: calc(var(--u) * 14); padding: calc(var(--u) * 24) calc(var(--u) * 36); }
/* 分數卡：圖片要能長按存起來 */
#cardImg {
  height: calc(var(--u) * 800); width: auto; max-width: 100%; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 18);
  -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
#cardScreen { background: #ddedf6; }
#cardBack {
  position: absolute; top: calc(var(--u) * 26); left: calc(var(--u) * 24); padding: calc(var(--u) * 10) calc(var(--u) * 16);
  background: none; border: 0; font-family: var(--font); font-size: calc(var(--u) * 34); color: #6e5a4c; cursor: pointer;
}
#cardBack:focus-visible { outline: calc(var(--u) * 4) solid var(--gold); border-radius: calc(var(--u) * 14); }
.tip { margin: 0; font-size: calc(var(--u) * 28); }
.saved { margin: 0; font-size: calc(var(--u) * 26); color: #2f6a55; }
#mute {
  position: absolute; top: calc(var(--u) * 130); right: calc(var(--u) * 20); width: calc(var(--u) * 64); height: calc(var(--u) * 64);
  border-radius: 50%; border: calc(var(--u) * 4) solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
#startScreen:not([hidden]) ~ #mute, #endScreen:not([hidden]) ~ #mute { top: calc(var(--u) * 24); right: calc(var(--u) * 24); }
#cardScreen:not([hidden]) ~ #mute { display: none; }
#mute svg { width: 56%; height: 56%; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="行李一件件通過 X 光機，往上滑開箱檢查、往下滑放行的遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>過安檢！</h1>
      <p class="tag">旅遊貓今天當安檢員</p>
      <img id="startArt" alt="旅遊貓站在 X 光機旁邊，螢幕上照出行李裡的剪刀">
      <ul class="how">
        <li>行李一件件通過 X 光機，看最前面那件裡面有什麼</li>
        <li>有剪刀、刀子、大瓶水這些不能帶的 → 往上滑開箱</li>
        <li>沒問題 → 往下滑放行。偶爾會有貓躲在裡面喔！</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 旅遊貓 TravelCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <div class="card">
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <img id="endTray" alt="這次沒收的東西">
      <div class="card fact">
        <b id="factWho"></b>
        <p class="txt" id="factTxt"></p>
        <p class="src" id="factSrc"></p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><div class="endPair"><a class="siteMore endMoreGames" href="../">玩其他遊戲</a><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a></div><p class="sign">© 旅遊貓 TravelCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="過安檢分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
      <a class="siteMore cardMoreGames" href="../">玩其他遊戲</a>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
