<style>
  html, body { margin: 0; height: 100%; background: #3a2418; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; justify-content: center; font-family: 'Huninn', "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #5A3A24;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  button { font-family: inherit; color: inherit; }
  #stage { position: relative; width: 100%; max-width: 62vh; max-width: 62dvh; height: 100vh; height: 100dvh; overflow: hidden; background: #F3C9A0; touch-action: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .rb { position: absolute; z-index: 4; top: calc(10px + env(safe-area-inset-top)); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,248,236,.85);
    box-shadow: 0 2px 0 rgba(120,70,30,.25); display: flex; align-items: center; justify-content: center; padding: 0; }
  #mute { right: 10px; } #music { right: 52px; }
  #title { position: absolute; z-index: 3; left: 12px; top: calc(12px + env(safe-area-inset-top)); padding: 6px 13px; border-radius: 999px; background: rgba(255,248,236,.88);
    font-size: 15px; letter-spacing: .12em; box-shadow: 0 2px 0 rgba(120,70,30,.22); }
  #tip { position: absolute; z-index: 3; left: 12px; right: 12px; top: calc(56px + env(safe-area-inset-top)); padding: 8px 12px 9px; border-radius: 14px; background: rgba(255,250,240,.93);
    box-shadow: 0 3px 0 rgba(120,70,30,.2), 0 8px 18px rgba(60,30,10,.15); font-size: 13.5px; line-height: 1.5; letter-spacing: .04em;
    opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .35s, transform .35s; }
  #tip.on { opacity: 1; transform: none; pointer-events: auto; }
  #title { cursor: pointer; }
  #title::after { content: "・小教室"; color: #C9302C; font-size: 12.5px; letter-spacing: .06em; }
  #tip b { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #C9302C; color: #FFF6E8; font-weight: normal; font-size: 12px; letter-spacing: .1em; }
  #tip .nx { float: right; margin: -2px -4px 0 6px; border: 0; background: none; font-size: 12px; color: #A0704A; padding: 2px 4px; }
  #hint { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(90,58,36,.82); color: #FFF4E2;
    font-size: 13.5px; letter-spacing: .08em; white-space: nowrap; pointer-events: none; transition: opacity .3s; }
  #panel { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,248,236,.95);

  .tab { flex: 1; max-width: 120px; height: 34px; border-radius: 999px; border: 1.5px solid #E2C7A4; background: #FFFDF8; font-size: 15px; letter-spacing: .1em; }

  .creams { display: flex; gap: 14px; align-items: center; }

  #loading { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #F3C9A0; font-size: 16px; letter-spacing: .1em; transition: opacity .35s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading i { display: inline-block; width: 11px; height: 11px; margin: 0 4px; border-radius: 50%; background: #C9302C; animation: hop 1s ease-in-out infinite; }
  #loading i:nth-child(2) { animation-delay: .15s; background: #2F7A4E; } #loading i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-9px); opacity: 1; } }
  #shot { position: absolute; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box;

  #shot.show { display: flex; }
  #shot img { width: 78%; max-width: 330px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }

  .lt { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,244,226,.45); background: rgba(255,255,255,.08); color: #FFF4E2; text-decoration: none; font-size: 14px; letter-spacing: .08em; }

  .copy { font-size: 11px; letter-spacing: .2em; opacity: .6; }
