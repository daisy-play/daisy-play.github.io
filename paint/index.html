<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：名畫畫畫看";
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：名畫畫畫看" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="藝術貓畫室：憑記憶畫名畫的遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1><span>名</span><span>畫</span><span>畫</span><span>畫</span><span>看</span></h1>
      <p class="tag">藝術貓畫室</p>
      <img id="startArt" alt="站在畫架旁的藝術貓">
      <ul class="how">
        <li>客人點一幅名畫，只給你看 3 秒！</li>
        <li>畫布蓋起來後，憑印象用手指塗回去</li>
        <li>顏色塗在對的地方就有分，不用畫得很像</li>
        <li>偶爾會來稀有客人點「貓版名畫」，分數 ×2！</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 藝術貓 ArtCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <img id="endWall" alt="今天畫的名畫">
      <div class="card">
        <p class="timeup">畫室打烊囉！</p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="card fact">
        <b>藝術貓小教室・名畫小知識</b>
        <p class="who" id="factWho"></p>
        <p class="txt" id="factTxt"></p>
        <p class="src">資料：維基百科</p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><div class="endPair"><a class="siteMore endMoreGames" href="../">玩其他遊戲</a><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a></div><p class="sign">© 藝術貓 ArtCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="名畫畫畫看分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
      <a class="siteMore cardMoreGames" href="../">玩其他遊戲</a>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
