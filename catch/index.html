<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>吃飯貓接接樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--ink:#5a3a22;--soft:#8a6a4e;--accent:#ff8a3d;--accent-dark:#c95a14;--card:#fffaf0;--line:#5a3a22;--chip:#ffefd2;--green:#5cbf6a;--green-dark:#2f8a42;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#ffe6bd;color:var(--ink);font-family:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden}
canvas{display:block;width:100%;height:100%}

/* 遊戲中的分數和愛心 */
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:var(--card);border:3px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);font-size:19px;font-weight:700;line-height:1.3}
#lives{font-size:17px;letter-spacing:1px}
#wrap:has(.overlay:not(.hidden)) #hud{visibility:hidden}

/* 開始、結束畫面 */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:58px 18px 34px;background:rgba(255,246,226,.25)}
.card{position:relative;width:100%;max-width:340px;padding:0 20px 20px;background:var(--card);border:4px solid var(--line);border-radius:30px;box-shadow:0 7px 0 var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
/* 卡片上下的 emoji 花邊 */
.lace{align-self:stretch;margin:0 -20px;padding:7px 0;background:#ffd98f;border-bottom:3px dashed var(--line);border-radius:25px 25px 0 0;font-size:17px;line-height:1.2;letter-spacing:5px;white-space:nowrap;overflow:hidden}
.card h1{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:.03em}
.card p{font-size:15px;line-height:1.6;color:var(--soft)}
.big{font-size:72px;line-height:1.05}
.catpic{display:block;width:104px;height:104px;object-fit:contain}
/* 結束畫面：吃飽的貓旁邊冒愛心、亮晶晶，還有一句話 */
.catbox{position:relative}
.deco{position:absolute;line-height:1;animation:twinkle 1.4s ease-in-out infinite}
.d1{right:-14px;top:2px;font-size:24px}
.d2{left:-14px;top:22px;font-size:18px;animation-delay:.5s}
.d3{right:-4px;bottom:6px;font-size:14px;animation-delay:.9s}
@keyframes twinkle{50%{transform:scale(1.25);opacity:.75}}
.say{position:absolute;left:-58px;top:-4px;padding:3px 9px;background:#fff;border:2.5px solid var(--line);border-radius:14px 14px 14px 4px;font-size:14px;font-weight:700;white-space:nowrap;transform:rotate(-6deg)}
.bob{animation:bob 1.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;list-style:none}
.chips li{padding:3px 10px;background:var(--chip);border:2px solid var(--line);border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
.btn{font:inherit;font-size:21px;font-weight:700;padding:11px 30px;margin:4px 0 7px;color:#fff;background:var(--accent);border:4px solid var(--line);border-radius:999px;box-shadow:0 6px 0 var(--line);cursor:pointer;text-shadow:0 2px 0 var(--accent-dark);transition:transform .08s,box-shadow .08s}
.btn:hover{background:#ff9a54}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.rank{padding:4px 16px;background:var(--green);border:3px solid var(--line);border-radius:12px;color:#fff;font-size:18px;font-weight:700;text-shadow:0 2px 0 var(--green-dark);transform:rotate(-2deg)}
.total{font-size:18px;font-weight:700;line-height:1.1}
.total b{font-size:50px;color:var(--accent-dark)}
.best{font-size:15px;color:var(--soft)}
.best b{color:var(--ink)}
#newBest{display:inline-block;margin-left:6px;padding:0 8px;background:#ffe27a;border:2px solid var(--line);border-radius:8px;color:var(--ink);font-weight:700}
.hidden{display:none!important}

/* 回首頁 */
.home{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:7px 14px;background:var(--card);border:3px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);font-size:16px;font-weight:700;color:var(--ink);text-decoration:none}
.home:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.home:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* 聲音開關：玩的時候在愛心下面，開始和結束畫面在右上角 */
#mute{position:absolute;z-index:3;top:calc(60px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);border:3px solid var(--line);border-radius:50%;box-shadow:0 3px 0 var(--line);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation}
#mute::after{content:'';position:absolute;inset:-8px}
#mute:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#mute:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#wrap:has(.overlay:not(.hidden)) #mute{top:calc(12px + env(safe-area-inset-top,0px))}

#credit{position:absolute;bottom:5px;left:0;width:100%;text-align:center;pointer-events:none}
#credit span{padding:1px 10px;background:rgba(255,250,240,.88);border-radius:999px;font-size:12px;color:var(--soft)}

/* 破紀錄的彩帶 */
#confetti{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
#confetti span{position:absolute;top:-40px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}#confetti{display:none}}
</style>
</head>
