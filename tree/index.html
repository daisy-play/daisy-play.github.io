<script>
const NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv'),O=document.getElementById('orn'),T=document.getElementById('tree'),HIT=document.getElementById('hit'),H=document.getElementById('hint'),EN=document.getElementById('en'),ST=document.getElementById('star'),SCR=document.getElementById('scr'),LT=document.getElementById('lightt'),TOP=document.getElementById('top'),CROW=document.getElementById('crow'),RMB=document.getElementById('rmb');
let kind='ball',ci=0,star=false,lit=false,n=0,rm=false,starC='#f3d98c',bg=['#232c58','#191c33','#111220'];
const CC=['#d5544a','#e3c06e','#6f9a7c','#81d8d0','#8aa5e3','#a58fd0','#d99aa8','#cfd3db'],CL=['#ffb8a8','#ffe7a8','#cdeec6','#c9f3ef','#c4d6ff','#ddd0ff','#ffd3dc','#f6f8fc'],CD=['#a83c34','#b8963f','#4f7a5e','#4fa8a0','#5f7cc0','#7c66ad','#b0707e','#9ea4b0'],CS=['#ef8478','#f3d98c','#a9d1b2','#b5ebe6','#b3c8f5','#cbbcf0','#f2bfca','#eceef3'],cr='#f3efe6',W8='#f8f4ec',colorable=['ball','bulb','sock','bow','gift','cane','snowman'];
const stripe=i=>i===7?'#9ea4b0':CC[i];
/* 音效：全部用程式合成（不用音檔），輕、像玻璃和小鈴鐺。靜音記在 tree-muted */
let AC=null,VOL=null,NZ=null,muted=false;try{muted=localStorage.getItem('tree-muted')==='1'}catch(e){}
function au(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext);VOL=AC.createGain();VOL.gain.value=muted?0:.8;VOL.connect(AC.destination);NZ=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,dur,vol,type='sine',at=0,f2){if(!AC||muted)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(1e-4,t+dur);o.connect(g);g.connect(VOL);o.start(t);o.stop(t+dur+.03)}
function bell(f,vol=.1,at=0,dur=.9){tone(f,dur,vol,'sine',at);tone(f*2.76,dur*.35,vol*.25,'sine',at);tone(f*5.4,dur*.15,vol*.08,'sine',at)}
function noise(freq,dur,vol,type='bandpass',at=0){if(!AC||muted)return;const t=AC.currentTime+at,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NZ;fl.type=type;fl.frequency.value=freq;fl.Q.value=.8;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(1e-4,t+dur);s.connect(fl);fl.connect(g);g.connect(VOL);s.start(t);s.stop(t+dur+.02)}
/* 掛上：每種裝飾一個固定的聲音，音都挑 C 大調的 Do、Mi、Sol（跟〈平安夜〉合） */
const HANG={
ball:()=>bell(1568,.09),                                   /* 彩球：玻璃叮（高 Sol） */
bulb:()=>tone(2637,.18,.05,'sine'),                        /* 小燈：很短的小亮點（更高的 Mi） */
cane:()=>{tone(1047,.16,.07,'triangle');noise(4000,.03,.04,'highpass')}, /* 拐杖糖：脆脆的糖果聲（Do） */
sock:()=>{noise(500,.12,.09,'lowpass');tone(523,.3,.05,'sine')},         /* 聖誕襪：軟軟的布（低 Do） */
bow:()=>{noise(2500,.1,.05,'bandpass');tone(1319,.35,.05,'sine',.03)},   /* 蝴蝶結：緞帶咻一下（Mi） */
gift:()=>{tone(784,.09,.1,'sine');tone(1568,.06,.03,'sine')},            /* 小禮物：小盒子「叩」（Sol） */
flake:()=>{bell(2093,.035,0,.5);bell(3136,.03,.06,.5)},                  /* 雪花：細細亮亮兩聲（高 Do、Sol） */
icicle:()=>{bell(1319,.08,0,1.2);tone(5274,.4,.012,'sine')},             /* 冰柱：冰冰的長玻璃聲（Mi） */
cone:()=>tone(392,.1,.12,'triangle',0,370),                              /* 松果：木頭「叩」（低 Sol） */
ginger:()=>{noise(1800,.06,.08,'bandpass');noise(1200,.05,.06,'bandpass',.05);tone(523,.2,.04,'sine')}, /* 薑餅人：餅乾喀滋（Do） */
snowman:()=>{noise(700,.18,.07,'lowpass');tone(659,.4,.05,'sine')}       /* 小雪人：雪「噗」一下（Mi） */
};
const SFX={
pick:()=>tone(1400,.05,.035,'sine'),
hang:k=>(HANG[k]||HANG.ball)(),
miss:()=>tone(240,.12,.06,'sine',0,170),
off:()=>tone(520,.09,.07,'sine',0,260),
star:()=>[1047,1319,1568,2093].forEach((f,i)=>bell(f,.07,i*.09,1.1)),
light:()=>{[2093,2637,3136,2349,2794,3520,2637].forEach((f,i)=>bell(f,.035,i*.055+Math.random()*.02,.7));bell(784,.06,0,1.6)},
dark:()=>tone(660,.35,.05,'sine',0,330),
reset:()=>[1568,1319,1175,1047,880].forEach((f,i)=>bell(f,.045,i*.06,.5)),

function mbox(f,t,v,dur=1.8){const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator(),g2=AC.createGain();o.type=o2.type='sine';o.frequency.value=f;o2.frequency.value=f*4;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(1e-4,t+dur);g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*.3,t+.003);g2.gain.exponentialRampToValueAtTime(1e-4,t+.22);
o.connect(g);g.connect(MUS);o2.connect(g2);g2.connect(MUS);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+.3)}
function mTick(){if(!AC||!musicOn)return;while(mNext<AC.currentTime+1.2){const S=SONGS[mSong],[nm,b]=S.n[mIdx],pb=mBeat-S.pick;
if(pb>=0&&pb%S.meter===0){const r=S.bass[pb/S.meter];if(r)mbox(BF[r]*2,mNext,.035,2.2)}
mbox(NT[nm]*2,mNext,.06);mNext+=b*S.beat;mBeat+=b;mIdx++;if(mIdx>=S.n.length){mIdx=0;mBeat=0;mSong=(mSong+1)%SONGS.length;mNext+=REST}}}
