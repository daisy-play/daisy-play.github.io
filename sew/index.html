<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：沿線縫縫看";
  else if (e.target.closest(".siteMore")) label = "玩其他遊戲：沿線縫縫看";   // 11/18：記下來，才知道多少人按
  else if (e.target.closest(".recGame")) label = "玩推薦：沿線縫縫看→" + (e.target.closest(".recGame").getAttribute("data-rec") || "首頁");
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：沿線縫縫看" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="繡框上的布和要沿著縫的虛線"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>沿線縫縫看</h1>
      <p class="sub">60 秒，幫手作貓縫出小作品</p>
      <img id="startCat" alt="手作貓和繡框">
      <ul class="how">
        <li>手指按住紅點，<b style="font-weight:400;color:var(--red)">沿著虛線拖</b>就會縫出線</li>
        <li>越貼著虛線，準度越高、分數越多</li>
        <li>一件有好幾條線，縫完會自動上色</li>
        <li>小貓會伸手來玩線，點牠的手趕走！</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 手作貓 HandmadeCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <div class="card">
        <p class="timeup" id="reached"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="rank" id="rank"></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="sold card">
        <b>今天的作品</b>
        <div class="goods" id="works"></div>
      </div>
      <div class="card tipc">
        <b>手作小知識</b>
        <p id="tipText"></p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><div class="endPair"><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請 Daisy 喝咖啡</a><a class="recGame" href="../"><img alt="" loading="lazy"><span class="recTxt"><small>玩下一款</small><b>玩其他遊戲</b></span></a></div><p class="sign">© 手作貓 HandmadeCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="沿線縫縫看分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
      <a class="siteMore cardMoreGames" href="../">玩其他遊戲</a>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
