<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：趁現在撥下去";
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：趁現在撥下去" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>
<style>
.homeLink { position: absolute; top: calc(var(--u) * 6); left: calc(var(--u) * 16); padding: calc(var(--u) * 30) calc(var(--u) * 24);
  font-family: var(--font); font-size: calc(var(--u) * 34); color: #9a7a5a; text-decoration: none; }
.homeLink:focus-visible { outline: calc(var(--u) * 4) solid currentColor; border-radius: calc(var(--u) * 14); }
/* 11/10：「玩其他遊戲」一律排在按鈕裡（結束畫面、分數卡、拼豆的作品畫面都一樣），不再浮在左上角 */
.siteMore { display: inline-block; padding: calc(var(--u) * 12) calc(var(--u) * 28); border-radius: 999px; text-decoration: none;
  background: #9a7a5a; color: #fff8ea; font-family: var(--font); font-size: calc(var(--u) * 28); box-shadow: 0 calc(var(--u) * 4) 0 rgba(79, 58, 45, .25); }
</style>
<style>
.signrow { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 2); }
.signrow .sign { margin: 0; }
.coffee { font-family: var(--font); font-size: calc(var(--u) * 30); color: #9a7a5a; text-decoration: none; line-height: 1.3;
  background: #fff8ea; padding: calc(var(--u) * 12) calc(var(--u) * 32); border: calc(var(--u) * 3) solid currentColor; border-radius: 999px;
  box-shadow: 0 calc(var(--u) * 4) 0 rgba(79, 58, 45, .18); }
.coffee:focus-visible { outline: calc(var(--u) * 4) solid currentColor; outline-offset: calc(var(--u) * 3); }

  padding: calc(var(--u) * 6) calc(var(--u) * 24); border: calc(var(--u) * 3) solid #9a7a5a; }   /* 她說矮一點沒關係：上下 12→6 */

<title>趁現在！撥下去</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：直式 9:16，從貓的角度看主人的書桌；平塗＋粗咖啡色外框，貓是 Daisy 家的貓（照片去背） */
:root {
  --wall: #f1e6d8;
  --ink: #3b2a1a;
  --cream: #fff8ea;
  --red: #e0525a;
  --blue: #4c8fd0;
  --yellow: #e8b923;
  --green: #6aaf7a;
  --orange: #f0a35a;
  --veil: rgba(241, 230, 216, .96);
  --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--wall); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; --u: 1px; touch-action: none; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.veil {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 20); background: var(--veil); text-align: center; padding: calc(var(--u) * 40);
  box-sizing: border-box;
}
.veil h1 { margin: 0; font-size: calc(var(--u) * 88); letter-spacing: .04em; color: var(--ink); font-weight: 400; line-height: 1.1; }
.veil h1 b { font-weight: 400; color: var(--red); }
#startCat { height: calc(var(--u) * 290); max-width: 100%; object-fit: contain; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--u) * 11); font-size: calc(var(--u) * 29); line-height: 1.35; }
.how li { background: #fff; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 22); padding: calc(var(--u) * 9) calc(var(--u) * 22); }
.how b { font-weight: 400; color: var(--red); }
.how i { font-style: normal; color: var(--green); }
.btn {
  font-family: var(--font); font-size: calc(var(--u) * 46); color: #fff; background: var(--red);
  border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 30); padding: calc(var(--u) * 14) calc(var(--u) * 64);
  box-shadow: 0 calc(var(--u) * 8) 0 var(--ink); cursor: pointer;
}
.btn:active { transform: translateY(calc(var(--u) * 6)); box-shadow: 0 calc(var(--u) * 2) 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn:focus-visible, #mute:focus-visible { outline: calc(var(--u) * 5) solid var(--yellow); outline-offset: calc(var(--u) * 5); }
.best { margin: 0; font-size: calc(var(--u) * 28); opacity: .75; }
.sign { margin: 0; font-size: calc(var(--u) * 22); color: #9a7a5a; }
.card {
  background: #fff; border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 34);
  padding: calc(var(--u) * 22) calc(var(--u) * 32); display: grid; gap: calc(var(--u) * 8); width: 100%; box-sizing: border-box;
}
.card p { margin: 0; }
.timeup { font-size: calc(var(--u) * 32); opacity: .8; }
.rank { font-size: calc(var(--u) * 50); color: var(--red); }
.score { font-size: calc(var(--u) * 108); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: calc(var(--u) * 38); }
.stats { font-size: calc(var(--u) * 26); opacity: .8; line-height: 1.5; white-space: pre-line; }
.newbest { font-size: calc(var(--u) * 30); color: #3f8a52; }
#floorImg { width: 100%; border-radius: calc(var(--u) * 20); display: block; }
.fact { text-align: left; gap: calc(var(--u) * 4); }
.fact b { font-weight: 400; font-size: calc(var(--u) * 26); color: var(--blue); }
.fact .txt { font-size: calc(var(--u) * 28); line-height: 1.45; }
#endCat { height: calc(var(--u) * 170); max-width: 100%; object-fit: contain; }
.row { display: flex; gap: calc(var(--u) * 20); justify-content: center; }
.row .btn { padding: calc(var(--u) * 14) calc(var(--u) * 40); }
.btn.alt { background: var(--blue); }
#cardImg {
  height: calc(var(--u) * 800); width: auto; max-width: 100%; border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 24);
  box-shadow: 0 calc(var(--u) * 10) 0 rgba(59, 42, 26, .22); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
#cardScreen { background: var(--wall); }
#cardBack {
  position: absolute; top: calc(var(--u) * 26); left: calc(var(--u) * 24); padding: calc(var(--u) * 10) calc(var(--u) * 16);
  background: none; border: 0; font-family: var(--font); font-size: calc(var(--u) * 34); color: #9a7a5a; cursor: pointer;
}
#cardBack:focus-visible { outline: calc(var(--u) * 4) solid var(--yellow); border-radius: calc(var(--u) * 14); }
.tip { margin: 0; font-size: calc(var(--u) * 30); }
.saved { margin: 0; font-size: calc(var(--u) * 28); color: #3f8a52; }
#mute {
  position: absolute; top: calc(var(--u) * 130); right: calc(var(--u) * 22); width: calc(var(--u) * 60); height: calc(var(--u) * 60);
  border-radius: 50%; border: calc(var(--u) * 4) solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
#mute svg { width: 56%; height: 56%; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
