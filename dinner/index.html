<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

<title>放飯時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：一張直式 9:16 的英語貓房間，等比縮放塞進螢幕；單一淡藍紫世界（不跟著深色模式變） */
:root {
  --wall: #d3d8f6;
  --ink: #3b2a1a;
  --cream: #fff8ea;
  --red: #e0525a;
  --blue: #4c8fd0;
  --yellow: #e8b923;
  --green: #6aaf7a;
  --veil: rgba(211, 216, 246, .95);
  --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --block: "Arial Black", "Arial", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--wall); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; --u: 1px; touch-action: none; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }
.veil {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 24); background: var(--veil); text-align: center; padding: calc(var(--u) * 40);
  box-sizing: border-box;
}
.veil h1 { margin: 0; font-size: calc(var(--u) * 100); letter-spacing: .06em; color: var(--ink); font-weight: 400; line-height: 1.1; }
.veil .sub { margin: calc(var(--u) * -14) 0 0; font-family: var(--block); font-weight: 900; font-size: calc(var(--u) * 38); color: var(--blue); letter-spacing: .04em; }
.blocks { display: flex; gap: calc(var(--u) * 10); }
.blocks span {
  width: calc(var(--u) * 58); height: calc(var(--u) * 58); border-radius: calc(var(--u) * 10); border: calc(var(--u) * 5) solid var(--ink);
  display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--block); font-weight: 900; font-size: calc(var(--u) * 34);
}
.blocks span:nth-child(1) { background: var(--red); transform: rotate(-6deg); }
.blocks span:nth-child(2) { background: var(--blue); transform: rotate(4deg); }
.blocks span:nth-child(3) { background: var(--yellow); transform: rotate(-3deg); }
.blocks span:nth-child(4) { background: var(--green); transform: rotate(5deg); }
.blocks span:nth-child(5) { background: var(--red); transform: rotate(-4deg); }
.blocks span:nth-child(6) { background: var(--blue); transform: rotate(6deg); }
.veil img { height: calc(var(--u) * 270); max-width: 100%; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--u) * 12); font-size: calc(var(--u) * 31); line-height: 1.35; }
.how li { background: #fff; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 22); padding: calc(var(--u) * 10) calc(var(--u) * 24); }
.btn {
  font-family: var(--font); font-size: calc(var(--u) * 46); color: #fff; background: var(--red);
  border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 30); padding: calc(var(--u) * 14) calc(var(--u) * 64);
  box-shadow: 0 calc(var(--u) * 8) 0 var(--ink); cursor: pointer;
}
.btn:active { transform: translateY(calc(var(--u) * 6)); box-shadow: 0 calc(var(--u) * 2) 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn:focus-visible, #mute:focus-visible { outline: calc(var(--u) * 5) solid var(--yellow); outline-offset: calc(var(--u) * 5); }
.best { margin: 0; font-size: calc(var(--u) * 28); opacity: .75; }
.sign { margin: 0; font-size: calc(var(--u) * 22); color: #6c6a94; }
.card {
  background: #fff; border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 34);
  padding: calc(var(--u) * 24) calc(var(--u) * 34); display: grid; gap: calc(var(--u) * 8); width: 100%; box-sizing: border-box;
}
.card p { margin: 0; }
.timeup { font-size: calc(var(--u) * 32); opacity: .8; }
.rank { font-size: calc(var(--u) * 52); color: var(--red); }
.score { font-size: calc(var(--u) * 112); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: calc(var(--u) * 38); }
.stats { font-size: calc(var(--u) * 27); opacity: .8; line-height: 1.5; }
.newbest { font-size: calc(var(--u) * 30); color: #3f8a52; }
.word { text-align: left; gap: calc(var(--u) * 4); }
.word b { font-weight: 400; font-size: calc(var(--u) * 26); color: var(--blue); }
.word .en { font-family: var(--block); font-weight: 900; font-size: calc(var(--u) * 50); line-height: 1.15; color: var(--ink); }
.word .zh { font-size: calc(var(--u) * 32); }
.word .ex { font-size: calc(var(--u) * 26); opacity: .7; }
#endCat { height: calc(var(--u) * 200); }
.row { display: flex; gap: calc(var(--u) * 20); justify-content: center; }
.row .btn { padding: calc(var(--u) * 14) calc(var(--u) * 40); }
.btn.alt { background: var(--blue); }
/* 分數卡：圖片要能長按存起來 */
#cardImg {
  height: calc(var(--u) * 800); width: auto; max-width: 100%; border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 24);
  box-shadow: 0 calc(var(--u) * 10) 0 rgba(59, 42, 26, .22); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
#cardScreen { background: var(--wall); }
#cardBack {
  position: absolute; top: calc(var(--u) * 26); left: calc(var(--u) * 24); padding: calc(var(--u) * 10) calc(var(--u) * 16);
  background: none; border: 0; font-family: var(--font); font-size: calc(var(--u) * 34); color: #6c6a94; cursor: pointer;
}
#cardBack:focus-visible { outline: calc(var(--u) * 4) solid var(--yellow); border-radius: calc(var(--u) * 14); }
.tip { margin: 0; font-size: calc(var(--u) * 30); }
.saved { margin: 0; font-size: calc(var(--u) * 28); color: #3f8a52; }
#mute {
  position: absolute; bottom: calc(var(--u) * 28); right: calc(var(--u) * 26); width: calc(var(--u) * 64); height: calc(var(--u) * 64);
  border-radius: 50%; border: calc(var(--u) * 4) solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
#mute svg { width: 56%; height: 56%; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="放飯遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>放飯時間！</h1>
      <div class="blocks" aria-hidden="true"><span>D</span><span>I</span><span>N</span><span>N</span><span>E</span><span>R</span></div>
      <img id="startCat" alt="胖橘">
      <ul class="how">
        <li>按住、停在碗上倒飼料；移太快會灑出來！</li>
        <li>胖橘吃超快，吃完會去搶別人的飯</li>
        <li>抓起胖橘，拖回她自己的碗！</li>
        <li>貓等太久會氣跑，跑掉 3 隻就收工</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 英語貓 EnglishCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <a class="homeLink" href="../">‹ 回首頁</a>
      <img id="endCat" alt="吃得圓滾滾的胖橘">
      <div class="card">
        <p class="timeup" id="reached"></p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="card word">
        <b>英語貓小教室</b>
        <p class="en" id="wordEn"></p>
        <p class="zh" id="wordZh"></p>
        <p class="ex" id="wordEx"></p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a><p class="sign">© 英語貓 EnglishCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="放飯時間分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
