<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：烤到凌晨三點";
  else if (e.target.closest(".siteMore")) label = "玩其他遊戲：烤到凌晨三點";   // 11/18：記下來，才知道多少人按
  else if (e.target.closest(".recGame")) label = "玩推薦：烤到凌晨三點→" + (e.target.closest(".recGame").getAttribute("data-rec") || "首頁");
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：烤到凌晨三點" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>
