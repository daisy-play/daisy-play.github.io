<script>
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn");
  if (!b || b.disabled || location.hash === "#test") return;
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: "開始玩：鈕扣分類盒", title: "開始玩：鈕扣分類盒", event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>

<title>鈕扣分類盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：一張直式 9:16 的羊毛氈工作桌，等比縮放塞進螢幕；單一暖色世界（不跟著深色模式變） */
:root {
  --table: #e9dcc3;
  --ink: #5a3d2e;
  --cream: #fff3d6;
  --red: #e0525c;
  --sage: #9cc27a;
  --veil: rgba(244, 236, 221, .94);
  --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--table); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; --u: 1px; touch-action: none; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.veil {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 26); background: var(--veil); text-align: center; padding: calc(var(--u) * 40);
  box-sizing: border-box;
}
.veil h1 { margin: 0; font-size: calc(var(--u) * 92); letter-spacing: .06em; color: var(--red); font-weight: 400; text-wrap: balance; }
.veil .sub { margin: 0; font-size: calc(var(--u) * 30); opacity: .8; }
.veil img { height: calc(var(--u) * 290); max-width: 100%; object-fit: contain; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--u) * 14); font-size: calc(var(--u) * 31); line-height: 1.4; }
.how li { background: var(--cream); border: calc(var(--u) * 3) dashed #d9c4a0; border-radius: calc(var(--u) * 22); padding: calc(var(--u) * 12) calc(var(--u) * 26); }
.btn {
  font-family: var(--font); font-size: calc(var(--u) * 44); color: var(--cream); background: var(--red);
  border: none; border-radius: calc(var(--u) * 40); padding: calc(var(--u) * 18) calc(var(--u) * 64);
  box-shadow: 0 calc(var(--u) * 6) 0 #b63d47; cursor: pointer;
}
.btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 #b63d47; }
.btn:disabled { opacity: .5; cursor: wait; }
.btn:focus-visible, #mute:focus-visible { outline: calc(var(--u) * 5) solid var(--sage); outline-offset: calc(var(--u) * 4); }
.best { margin: 0; font-size: calc(var(--u) * 28); opacity: .75; }
.sign { margin: 0; font-size: calc(var(--u) * 22); color: #a58866; }
.card {
  background: var(--cream); border: calc(var(--u) * 4) dashed #d9c4a0; border-radius: calc(var(--u) * 40);
  padding: calc(var(--u) * 28) calc(var(--u) * 36); display: grid; gap: calc(var(--u) * 10); width: 100%; box-sizing: border-box;
}
.card p { margin: 0; }
.timeup { font-size: calc(var(--u) * 34); opacity: .8; }
.rank { font-size: calc(var(--u) * 52); color: var(--red); }
.score { font-size: calc(var(--u) * 116); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: calc(var(--u) * 40); }
.stats { font-size: calc(var(--u) * 28); opacity: .8; }
.newbest { font-size: calc(var(--u) * 30); color: #4f8a3a; }
.fact { text-align: left; background: #fff; border-radius: calc(var(--u) * 26); padding: calc(var(--u) * 22) calc(var(--u) * 28); display: grid; gap: calc(var(--u) * 8); }
.fact b { font-weight: 400; font-size: calc(var(--u) * 30); color: #4f8a3a; }
.fact p { font-size: calc(var(--u) * 31); line-height: 1.55; }
.fact small { font-size: calc(var(--u) * 22); opacity: .6; }
#endCat { height: calc(var(--u) * 200); }
.row { display: flex; gap: calc(var(--u) * 20); justify-content: center; }
.row .btn { padding: calc(var(--u) * 18) calc(var(--u) * 40); }
.btn.alt { background: #6f9a52; box-shadow: 0 calc(var(--u) * 6) 0 #557a3d; }
.btn.alt:active { box-shadow: 0 calc(var(--u) * 2) 0 #557a3d; }
/* 分數卡：圖片要能長按存起來 */
#cardScreen { background: #f4ecdd; }
#cardImg {
  height: calc(var(--u) * 800); width: auto; max-width: 100%; border-radius: calc(var(--u) * 28);
  box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 18) rgba(90, 70, 50, .25); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
#cardBack {
  position: absolute; top: calc(var(--u) * 26); left: calc(var(--u) * 24); padding: calc(var(--u) * 10) calc(var(--u) * 16);
  background: none; border: 0; font-family: var(--font); font-size: calc(var(--u) * 34); color: #9b7a5c; cursor: pointer;
}
#cardBack:focus-visible { outline: calc(var(--u) * 4) solid var(--sage); border-radius: calc(var(--u) * 14); }
.tip { margin: 0; font-size: calc(var(--u) * 30); }
.saved { margin: 0; font-size: calc(var(--u) * 28); color: #4f8a3a; }
#mute {
  position: absolute; top: calc(var(--u) * 150); left: calc(var(--u) * 330); width: calc(var(--u) * 60); height: calc(var(--u) * 60);
  border-radius: 50%; border: calc(var(--u) * 3) dashed #cdb68a; background: var(--cream); color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
#mute.corner { top: calc(var(--u) * 38); left: auto; right: calc(var(--u) * 26); width: calc(var(--u) * 66); height: calc(var(--u) * 66); }
#mute svg { width: 58%; height: 58%; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="鈕扣分類遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>鈕扣分類盒</h1>
      <p class="sub">60 秒，幫手作貓整理鈕扣</p>
      <img id="startCat" alt="手作貓">
      <ul class="how">
        <li>按住鈕扣，拖到對的格子上放開</li>
        <li>先看顏色，之後規則會變喔！</li>
        <li>掉下來的貓玩具，拖去給貓</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 手作貓 HandmadeCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <a class="homeLink more" href="../">🎮 玩其他遊戲</a>
      <img id="endCat" alt="手作貓">
      <div class="card">
        <p class="timeup">時間到！</p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="fact card">
        <b>鈕扣小知識</b>
        <p id="fact"></p>
        <small>資料：維基百科「Button」條目</small>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a><p class="sign">© 手作貓 HandmadeCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="鈕扣分類盒分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
    </div>

    <button id="mute" class="corner" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
