<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：幫貓鏟屎";
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：幫貓鏟屎" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>

<style>
/* 版面：一張直式 9:16 的羊毛氈遊戲桌，等比縮放塞進螢幕；單一暖色世界（不跟著深色模式變） */
:root {
  --table: #e9dcc3;
  --ink: #5a3d2e;
  --cream: #fff3d6;
  --red: #e0525c;
  --sage: #9cc27a;
  --veil: rgba(244, 236, 221, .93);

  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--table); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; --u: 1px; touch-action: none; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }
.veil {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 26); background: var(--veil); text-align: center; padding: calc(var(--u) * 40);
  box-sizing: border-box;
}
.veil h1 { margin: 0; font-size: calc(var(--u) * 96); letter-spacing: .06em; color: var(--red); font-weight: 400; text-wrap: balance; }
.veil .sub { margin: 0; font-size: calc(var(--u) * 30); opacity: .8; }
.veil img { height: calc(var(--u) * 300); max-width: 100%; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--u) * 14); font-size: calc(var(--u) * 32); line-height: 1.4; }
.how li { background: var(--cream); border: calc(var(--u) * 3) dashed #d9c4a0; border-radius: calc(var(--u) * 22); padding: calc(var(--u) * 12) calc(var(--u) * 26); }
.btn {
  font-family: var(--font); font-size: calc(var(--u) * 44); color: var(--cream); background: var(--red);
  border: none; border-radius: calc(var(--u) * 40); padding: calc(var(--u) * 18) calc(var(--u) * 64);
  box-shadow: 0 calc(var(--u) * 6) 0 #b63d47; cursor: pointer;

.btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 #b63d47; }

.btn:focus-visible, .mini:focus-visible, #mute:focus-visible { outline: calc(var(--u) * 5) solid var(--sage); outline-offset: calc(var(--u) * 4); }
.mini {

  border: calc(var(--u) * 3) solid #cdb68a; border-radius: calc(var(--u) * 30); padding: calc(var(--u) * 8) calc(var(--u) * 28); cursor: pointer;
}
.best { margin: 0; font-size: calc(var(--u) * 28); opacity: .75; }
.sign { margin: 0; font-size: calc(var(--u) * 22); color: #a58866; }
.card {
  background: var(--cream); border: calc(var(--u) * 4) dashed #d9c4a0; border-radius: calc(var(--u) * 40);

.fact small { font-size: calc(var(--u) * 22); opacity: .6; }

.btn.alt:active { box-shadow: 0 calc(var(--u) * 2) 0 #557a3d; }

#cardScreen { background: #f4ecdd; }
#cardImg {
  height: calc(var(--u) * 800); width: auto; max-width: 100%; border-radius: calc(var(--u) * 28);

}

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="貓砂盆遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>幫貓鏟屎</h1>
      <p class="sub">60 秒，讓貓主子滿意</p>
      <img id="startCat" alt="手作貓">
      <ul class="how">
        <li>按住鏟子，撈起砂裡的小團子</li>
        <li>搖一搖，把砂抖掉</li>
        <li>丟進右下角的垃圾桶</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 手作貓 HandmadeCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <img id="endCat" alt="手作貓">
      <div class="card">
        <p class="timeup">時間到！</p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="fact card">
        <b>貓砂小知識</b>
        <p id="fact"></p>
        <small>資料：維基百科「Cat litter」「Bentonite」條目</small>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><div class="endPair"><a class="siteMore endMoreGames" href="../">玩其他遊戲</a><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a></div><p class="sign">© 手作貓 HandmadeCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="幫貓鏟屎分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
      <a class="siteMore cardMoreGames" href="../">玩其他遊戲</a>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
