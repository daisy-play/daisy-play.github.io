<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="幫藝術貓梳毛的遊戲畫面"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>別再<b>喵</b>了！</h1>
      <p class="tag">幫藝術貓梳梳毛</p>
      <img id="startCat" alt="藝術貓">
      <ul class="how">
        <li>按住梳毛，毛球會越滾越大</li>
        <li>放開手，毛球飛進籃子，越大顆越高分</li>
        <li>找到她最舒服的地方，毛掉得特別快！</li>
        <li>太吵鄰居會敲牆、梳肚子她會哈你，毛球都會散掉</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 藝術貓 ArtCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <a class="homeLink more" href="../">🎮 玩其他遊戲</a>
      <div class="endTop">
        <img id="endCat" alt="梳得很開心的藝術貓">
        <figure class="art">
          <img id="endArt" alt="用今天的毛球擺成的作品">
          <figcaption id="artTitle"></figcaption>
        </figure>
      </div>
      <div class="card">
        <p class="timeup" id="reason"></p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="card fact">
        <b>藝術貓小教室・名畫裡的貓</b>
        <p class="who" id="factWho"></p>
        <p class="txt" id="factTxt"></p>
        <p class="src">資料：維基百科</p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請開發貓貓喝杯咖啡</a><p class="sign">© 藝術貓 ArtCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>

      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
    </div>

  </div>
</div>
