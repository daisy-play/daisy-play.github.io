<script>
document.addEventListener("click", function (e) {
  if (!e.target.closest || location.hash === "#test") return;
  var label;
  if (e.target.closest('a[href*="ecpay.com.tw"]')) label = "按贊助：挑掉三色豆";
  else if (e.target.closest(".siteMore")) label = "玩其他遊戲：挑掉三色豆";   // 11/18：記下來，才知道多少人按
  else if (e.target.closest(".recGame")) label = "玩推薦：挑掉三色豆→" + (e.target.closest(".recGame").getAttribute("data-rec") || "首頁");
  else {
    var b = e.target.closest("#go,#again,#cardAgain,#startBtn,#againBtn,[data-gc]");
    if (!b || b.disabled) return;
    label = "開始玩：挑掉三色豆" + (b.getAttribute("data-gc") || "");   // 11/10：data-gc 加在後面（例：拼豆的慢慢做）
  }
  (function send(n) {
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: label, title: label, event: true });
    else if (n < 20) setTimeout(function () { send(n + 1); }, 500);
  })(0);
}, true);
</script>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="一盤混在一起的三色豆，下面有玉米、豌豆、紅蘿蔔三個碟子"></canvas>

    <div id="startScreen" class="veil">
      <a class="homeLink" href="../">‹ 回首頁</a>
      <h1>挑掉三色豆！</h1>
      <div class="blocks" aria-hidden="true"><span>P</span><span>I</span><span>C</span><span>K</span><span>Y</span></div>
      <img id="startCat" alt="胖橘">
      <ul class="how">
        <li>按住豆子，<b>拖到對的碟子</b>（用甩的也行）</li>
        <li>玉米、豌豆、紅蘿蔔各一個碟子，分錯扣分</li>
        <li>小心！<i>蛋、火腿、蔥花</i>混在裡面，<b>拖給胖橘</b>吃</li>
        <li>連續分對分數越來越多，清空盤子有獎勵</li>
        <li>媽媽會一直再加一匙……</li>
      </ul>
      <button id="go" class="btn" disabled>準備中…</button>
      <p class="best" id="bestStart"></p>
      <p class="sign">© 英語貓 EnglishCat</p>
    </div>

    <div id="endScreen" class="veil" hidden>
      <div class="endHead">
        <p class="endTitle">挑掉三色豆！</p>
        <img id="endArt" alt="胖橘和三個碟子，裝著分好的玉米、豌豆、紅蘿蔔">
      </div>
      <div class="card">
        <p class="timeup" id="reached"></p>
        <p class="rank" id="rank"></p>
        <p class="score"><span id="final">0</span><small> 分</small></p>
        <p class="newbest" id="newbest" hidden>新紀錄！</p>
        <p class="stats" id="stats"></p>
      </div>
      <div class="card word">
        <b>英語貓小教室</b>
        <p class="en" id="wordEn"></p>
        <p class="zh" id="wordZh"></p>
        <p class="ex" id="wordEx"></p>
      </div>
      <div class="row">
        <button id="makeCard" class="btn alt">做分數卡</button>
        <button id="again" class="btn">再玩一次</button>
      </div>
      <div class="signrow"><div class="endPair"><a class="coffee" href="https://p.ecpay.com.tw/463A54A" target="_blank" rel="noopener">☕ 請 Daisy 喝咖啡</a><a class="recGame" href="../"><img alt="" loading="lazy"><span class="recTxt"><small>玩下一款</small><b>玩其他遊戲</b></span></a></div><p class="sign">© 英語貓 EnglishCat</p></div>
    </div>

    <div id="cardScreen" class="veil" hidden>
      <button id="cardBack" aria-label="返回成績">‹ 返回</button>
      <img id="cardImg" alt="挑掉三色豆分數卡">
      <p class="tip" id="cardTip"></p>
      <p class="saved" id="cardSaved" hidden>存好了！</p>
      <div class="row">
        <button id="cardSave" class="btn alt" hidden>存成圖片</button>
        <button id="cardAgain" class="btn">再玩一次</button>
      </div>
      <a class="siteMore cardMoreGames" href="../">玩其他遊戲</a>
    </div>

    <button id="mute" aria-label="聲音開關" title="聲音開關"></button>
  </div>
</div>
